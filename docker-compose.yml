services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kpi_crawler
      POSTGRES_USER: kpi_crawler
      POSTGRES_PASSWORD: kpi_crawler
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpi_crawler -d kpi_crawler"]
      interval: 2s
      timeout: 3s
      retries: 15
